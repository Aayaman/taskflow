spring:
  application:
    name: taskflow
  config:
    # Local development: load .env from the working directory if present.
    # Real environment variables always take precedence.
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:15432}/${POSTGRES_DB:taskflow}
    username: ${POSTGRES_USER:taskflow}
    # No default on purpose: startup must fail if the secret is missing.
    password: ${POSTGRES_PASSWORD}
    hikari:
      # Unqualified SQL from the application resolves to the taskflow schema.
      schema: taskflow

  flyway:
    # Flyway creates and owns the taskflow schema, and keeps its history table there.
    schemas: taskflow
    create-schemas: true
    locations: classpath:db/migration
    # Explicit for intent: never allow 'flyway clean' to wipe a database.
    clean-disabled: true

  jackson:
    deserialization:
      # Reject fields the API does not support instead of silently ignoring them.
      fail-on-unknown-properties: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        # Only health is reachable over HTTP; everything else stays internal.
        include: health
  endpoint:
    health:
      # Show UP/DOWN per component (db, redis) but never their details.
      show-components: always
      show-details: never

springdoc:
  # The spec (/v3/api-docs) and Swagger UI (/swagger-ui.html) are public for local
  # development. Restrict or disable them before deploying (M8).
  default-produces-media-type: application/json

taskflow:
  worker:
    # Same deployable, two roles: set to false for API-only instances.
    enabled: true
    concurrency: 4
    poll-interval: 1s
    shutdown-timeout: 30s
